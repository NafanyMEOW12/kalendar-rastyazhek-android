name: Build Android APK and Deploy Flexi AI
on:
  workflow_dispatch:
  push:
    paths:
      - 'KalendarRastyazhekAndroid_project.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  deploy-ai:
    name: Deploy Flexi AI server
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4
      - name: Extract project and AI server
        run: unzip -o KalendarRastyazhekAndroid_project.zip -d .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy Cloudflare Worker
        working-directory: flexi-ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler deploy
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -o KalendarRastyazhekAndroid_project.zip -d .
      - name: Fix Android JSON compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path(
              "KalendarRastyazhekAndroid/app/src/main/java/ru/kalendar/rastyazhek/SummaryReceiver.java"
          )
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  "for (String key : obj.keySet()) {",
                  "java.util.Iterator<String> keys = obj.keys();\n"
                  "            while (keys.hasNext()) {\n"
                  "                String key = keys.next();"
              )
              p.write_text(s)
          PY
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p KalendarRastyazhekAndroid assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalendar-Rastyazhek-APK
          path: KalendarRastyazhekAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
